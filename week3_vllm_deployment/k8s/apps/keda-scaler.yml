apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-vlm-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-vlm-deployment
  minReplicaCount: 1
  maxReplicaCount: 6                 # was: 2
  cooldownPeriod: 300
  pollingInterval: 10
  triggers:
    # 1. Warm-start during business hours (NY Time)
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 8 * * 1-5
        end: 0 18 * * 1-5
        desiredReplicas: "1"
    # 2. Aggressive scaling based on vLLM Queue Depth (T4)
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        metricName: vllm_num_requests_waiting
        threshold: '1'
        query: sum(vllm:num_requests_waiting{kubernetes_namespace="default"})