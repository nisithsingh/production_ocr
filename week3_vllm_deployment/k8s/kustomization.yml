apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - apps/deployment-vlm.yml
  - apps/keda-scaler.yml
  - networking/service.yml

labels:
  - includeSelectors: true
    pairs:
      managed-by: tnm-deployment-agent
      system: aks-ocr-deepseek          # was: aks-ocr-unlimitedocr

configMapGenerator:
  - name: ocr-pipeline-config
    literals:
      # --- vLLM OCR VLM Server Config ---
      - SERVED_NAME=deepseek-ocr                          # was: baidu/Unlimited-OCR
      - MODEL_ID=deepseek-ai/DeepSeek-OCR-2                # was: baidu/Unlimited-OCR
      - PORT=8000
      - GPU_MEMORY=0.9
      - DTYPE=half                                         # new — T4 has no BF16 support
      - MAX_MODEL_LEN=8192                                 # was: 32768
      - MAX_NUM_BATCHED_TOKENS=4096                         # was: 65536
      - MAX_NUM_SEQS=8                                      # was: 64
      - LOGITS_PROCESSOR=vllm.model_executor.models.deepseek_ocr:NGramPerReqLogitsProcessor  # new